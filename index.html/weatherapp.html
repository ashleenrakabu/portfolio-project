<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header>
      <div>
        <h1>Weather App</h1>
        <p class="subtitle">Check the current weather in your city</p>
      </div>
      <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </header>

    <!-- Weather Search -->
    <section class="card search-card">
      <div class="card-header">
        <h2>Search for a City</h2>
      </div>
      <div class="search-content">
        <input type="text" id="city-input" placeholder="Enter city name">
        <button id="search-btn" class="btn btn-primary">Search</button>
      </div>
    </section>

    <!-- Weather Display -->
    <section class="card weather-card">
      <div class="card-header">
        <h2>Current Weather</h2>
      </div>
      <div id="weather-display" class="weather-display">
        <!-- Weather information will be displayed here -->
      </div>
    </section>
  </div>

  <script>

    const RAPIDAPI_KEY = "895614a737mshddc08b315c8cedfp1e9087jsn9ebe49f55d9e";
    const RAPIDAPI_HOST = "weather-api167.p.rapidapi.com";
    const cityInput = document.getElementById("city-input");
    const searchButton = document.getElementById("search-btn");
    const weatherDisplay = document.getElementById("weather-display");

    async function searchWeather() {
      const city = cityInput.value.trim();
      if (!city) {
        weatherDisplay.textContent = "Enter a city name to search.";
        return;
      }

      weatherDisplay.textContent = "Loading weather…";
      searchButton.disabled = true;

      const params = new URLSearchParams({
        lon: "0",
        lat: "0",
        place: city,
        units: "standard",
        lang: "en",
        mode: "json"
      });

      try {
        const response = await fetch(
          `https://${RAPIDAPI_HOST}/api/weather/current?${params.toString()}`,
          {
            method: "GET",
            headers: {
              Accept: "application/json",
              "x-rapidapi-host": RAPIDAPI_HOST,
              "x-rapidapi-key": RAPIDAPI_KEY
            }
          }
        );

        if (!response.ok) {
          throw new Error(`Request failed (${response.status}). Check your API key and city.`);
        }

        const data = await response.json();
        const current = data.current || data;
        const main = current.main || current;
        const weather = Array.isArray(current.weather) ? current.weather[0] : current.weather;
        const name = current.name || data.name || city;
        const country = current.sys?.country || data.sys?.country;

        weatherDisplay.replaceChildren();
        const heading = document.createElement("h3");
        heading.textContent = country ? `${name}, ${country}` : name;
        weatherDisplay.appendChild(heading);

        const details = document.createElement("p");
        const readings = [
          main.temp != null ? `Temperature: ${main.temp}°` : null,
          weather?.description ? `Conditions: ${weather.description}` : null,
          main.humidity != null ? `Humidity: ${main.humidity}%` : null,
          current.wind?.speed != null ? `Wind: ${current.wind.speed} m/s` : null
        ].filter(Boolean);
        details.textContent = readings.length
          ? readings.join(" · ")
          : "Weather data was returned, but current conditions were not found.";
        weatherDisplay.appendChild(details);
      } catch (error) {
        weatherDisplay.textContent = error.message || "Unable to load weather. Please try again.";
      } finally {
        searchButton.disabled = false;
      }
    }

    searchButton.addEventListener("click", searchWeather);
    cityInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") searchWeather();
    });
  </script>
</body>
</html>
